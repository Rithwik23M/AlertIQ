# ============================================================================ #
# AlertIQ — Cloud Run Service Definition (Staging)
# ============================================================================ #
#
# Declarative IaC for the AlertIQ API staging service.
# Deploy with:
#
#   gcloud run services replace deploy/cloudrun-staging.yaml \
#     --region europe-west1 \
#     --project <GCP_PROJECT_ID>
#
# The CD workflow substitutes the three placeholders before calling
# `gcloud run services replace`:
#
#   IMAGE_TAG_PLACEHOLDER  →  full Artifact Registry image URL with SHA tag
#   GIT_SHA_PLACEHOLDER    →  40-character Git commit SHA
#   DIGEST_PLACEHOLDER     →  sha256:... image content digest
#
# Region: europe-west1 (St. Ghislain, Belgium).
# Selected because:
#   - Sub-20 ms latency to Dublin (primary users)
#   - EU infrastructure — data stays within the EU at the Cloud Run layer
#   - GCP carbon-neutral since 2007 in this region
#   - One of the most cost-effective European GCP regions
#
# IMPORTANT — compliance note:
#   EU region alone does NOT establish GDPR compliance, a Data Processing
#   Agreement, or any banking/AML regulatory compliance.  Consult legal
#   counsel before processing real financial or personal data in any
#   environment.
#
# Environment variables that control runtime behaviour are defined in this
# file as non-sensitive config.  True secrets (API keys, credentials) must
# be stored in Google Secret Manager and referenced via secretKeyRef; this
# service currently has no secret dependencies beyond the GCP token that
# Cloud Run injects automatically.
#
# ============================================================================ #

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alertiq-api-staging
  # Labels for cost attribution and filtering in the Cloud Console.
  labels:
    app: alertiq
    tier: staging
    managed-by: github-actions
  annotations:
    # Human-readable description visible in the Cloud Console.
    run.googleapis.com/description: "AlertIQ AML triage API — staging environment"

spec:
  template:
    metadata:
      annotations:
        # ── Autoscaling ─────────────────────────────────────────────── #
        # Staging: scale to zero when idle (saves cost).
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"

        # ── CPU policy ──────────────────────────────────────────────── #
        # Only allocate CPU during request processing (request-based billing).
        run.googleapis.com/cpu-throttling: "true"

        # ── Startup boost ───────────────────────────────────────────── #
        # Cloud Run temporarily allocates extra CPU during startup to shorten
        # the cold-start model load (baked-in joblib artifact, ~1–3 s).
        run.googleapis.com/startup-cpu-boost: "true"

    spec:
      # Maximum concurrent requests per container instance.
      # LightGBM inference is CPU-bound; 4 concurrent requests per instance
      # avoids contention while keeping latency predictable.
      containerConcurrency: 4

      # Cloud Run terminates a request after this many seconds.
      # Batch scoring of up to 200 alerts should complete well within 30 s.
      timeoutSeconds: 30

      containers:
        - image: IMAGE_TAG_PLACEHOLDER

          # ── Port ──────────────────────────────────────────────────── #
          ports:
            - name: http1
              containerPort: 8080

          # ── Resource allocation ───────────────────────────────────── #
          resources:
            limits:
              cpu: "1"
              memory: 512Mi

          # ── Runtime environment ───────────────────────────────────── #
          env:
            - name: ALERTIQ_ENV
              value: staging

            - name: ALERTIQ_LOG_LEVEL
              value: INFO

            # Audit log: empty string → Python logging (no file IO required).
            # Structured stdout is ingested automatically by Cloud Logging.
            # See docs/OPERATIONS_RUNBOOK.md §Audit Durability for the full
            # durability classification and production upgrade path.
            - name: ALERTIQ_AUDIT_LOG_PATH
              value: ""

            # Model registry path inside the container (baked in by the image).
            - name: ALERTIQ_REGISTRY_PATH
              value: /app/model_registry

            # Uvicorn worker count: 1 per container because Cloud Run handles
            # horizontal scaling; multiple workers per container would conflict
            # with the containerConcurrency limit.
            - name: ALERTIQ_WORKERS
              value: "1"

            # ── Deployment traceability ─────────────────────────────── #
            # Injected by the CD workflow at deploy time; exposed via GET /health.
            - name: ALERTIQ_GIT_SHA
              value: GIT_SHA_PLACEHOLDER

            - name: ALERTIQ_IMAGE_DIGEST
              value: DIGEST_PLACEHOLDER

          # ── Liveness probe ────────────────────────────────────────── #
          # Liveness: is the process alive?
          # A failure here causes Cloud Run to restart the container.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          # ── Startup probe ─────────────────────────────────────────── #
          # Startup probe: give the cold-start model load time to complete.
          # Cloud Run will not route traffic until this succeeds.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12    # 5 + 12×5 = 65 s maximum wait
            timeoutSeconds: 5

  # ── Traffic routing ──────────────────────────────────────────────────── #
  # 100 % of traffic goes to the latest revision automatically.
  traffic:
    - percent: 100
      latestRevision: true
